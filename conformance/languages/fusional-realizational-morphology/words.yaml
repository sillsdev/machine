      also contains the sibling BLOCKSIB, which declares no AssignedHeadFeatures at all -- an empty
      SyntacticFeatureStruct trivially subsumes an empty one, so were mrCompoundHN blockable,
      CheckBlocking would fire on family membership alone and substitute BLOCKSIB's own bare entry
      wherever this compound's output would surface, and the resulting resynthesis ("zon") would not
      match this word's own input shape ("cor+riv"). Because mrCompoundHN declares blockable="false",
      that substitution never happens and the ordinary compound analysis stands.
