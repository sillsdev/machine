# HAND DERIVATION (authored BEFORE running the oracle, per
# docs/conformance-language-suite-plan.md phase G2's authoring discipline -- see grammar.xml for the
# rule definitions these derivations reason from). This grammar has no phonological rules and no
# AffixTemplate at all (every MorphologicalRule/RealizationalRule/CompoundingRule applies freely,
# unordered) -- so a bare root is a valid word whenever nothing else (a StemName region, a Family
# collision, an IsBlocked check) specifically forbids it.
#
#   1. mun -> STEM's default (unrestricted) allomorph, bare, no person feature assigned at all. The
#      default allomorph carries no stemName, so it has no region to fail to satisfy.
#        -> STEM|mun, rules: []
#   2. muno -> STEM's default allomorph + P1 ("-o"). Once a person feature IS assigned, snP1P2 and
#      snP1P3's regions jointly exhaust the whole person space {1,2,3} -- so the default allomorph,
#      valid only in the absence of any person-governed region, can never combine with ANY person
#      suffix. Zero parses.
#        -> expect_fail
#   3. mano -> STEM's snP1P2-restricted allomorph "man" + P1. P1 is in snP1P2's region {1,2} -> valid.
#        -> STEM+P1|mano, rules: [mrPers1]
#   4. mant -> STEM's snP1P2-restricted allomorph "man" + P3 ("-t"). P3 is NOT in snP1P2's region
#      {1,2} -> zero parses.
#        -> expect_fail
#   5. fer -> FER, bare, no lexical head features at all, no rule touches it -> trivially valid.
#        -> FER|fer, rules: []
#
# The remaining words either reuse these same mechanisms on independent lexical material (the
# realizational-rule/family-blocking/circumfix/infix/compounding/MPR-group/ablaut sections) or are
# expect_fail words whose signature is the empty set.
#
# Reconciliation against the oracle (self-check): the 5 words above matched on the first run with no
# disagreement. The remaining 44 words needed several real fixes before matching -- none were hand-
# derivation errors in the sense of "wrong linguistic reasoning"; all were genuine grammar-authoring/
# engine-interaction discoveries, reported here in full rather than silently smoothed over:
#
#   1. Morph-chain order for a PREFIX is LEFT-TO-RIGHT SURFACE POSITION (prefix morpheme first), not
#      "root first, affixes after" the way every suffix-only example in this suite (and suffixing-
#      quechua) reads -- none of the ledger's source v1 fixtures used a real MorphemeId on a
#      prefixing rule (they tested the mechanism only, MorphemeId left unset), so there was no
#      precedent to crib from. Resolved empirically via --propose: confirmed on gelobt (GET+LOB, not
#      LOB+GET) and xped (THEMEX+PED).
#   2. The compounding seam's boundary marker "+" must be declared as a BoundaryDefinition (DTD
#      element under CharacterDefinitionTable), not a plain SegmentDefinition -- declaring it as a
#      segment made every compound word find ZERO parses (confirmed by isolated probing against v1
#      compounding/nonhead-not-root's own grammar.xml, which uses BoundaryDefinition). It renders as
#      "+?" in the signature (matching v1's own "(pʰ)ut+?dat"), never as a literal character in the
#      surface word text.
#   3. mrSuffixS3's literal suffix was originally "-s", identical to mrPers1's own "-s" ending on
#      any posV root sharing no AffixTemplate -- every "-s"-suffixed word (muns, lobs) spuriously
#      double-analyzed as both. Renamed S3's suffix to "-h" (mrSuffixS3 requiredPartsOfSpeech=posV;
#      mrEndH is a DIFFERENT rule, gated posN, so the two "-h" suffixes never collide).
#   4. mrAblaut, gated on the shared "posV", let ANY posV word containing "a" get a spurious extra
#      analysis where the "a" was hypothesized as an ablaut-changed "i" reverting to some OTHER posV
#      root -- concretely, "mano" (STEM+P1) ALSO analyzed as STEM(reverting "man"'s "a" back to "i",
#      landing on the real "min" allomorph)+ABLAUT+P1, a genuine cross-construct collision between
#      two unrelated grammar sections that happened to share both a POS gate and a coincidental
#      vowel-alternation pattern. Fixed by giving SING (mrAblaut's only intended target) its own POS,
#      posAblautV, confining the reversal search to exactly the one root it describes.
#   5. The two CompoundingRules (mrCompoundHN, mrCompoundNH) both had unrestricted wildcard head/
#      nonhead patterns and no POS gating, so mrCompoundNH ALSO matched "pannox" (reading it as
#      nonhead="pan"+head="nox", producing the identical signature mrCompoundHN already derives) --
#      every compound word double-counted. Fixed by giving each CompoundingRule's Set its own disjoint
#      POS pair (posN1/posV1 for Set 1, posN2/posV2 for Set 2) via headPartsOfSpeech/
#      nonHeadPartsOfSpeech, confining each rule to its own lexical material.
#   6. Set 2 (prefix-commute) originally put the homophone-ambiguity pair on the NON-head (mirroring
#      Set 1) with mrPrefixBe2 (posV-gated) attaching to the HEAD (a plain noun, "dom") -- but a
#      posV-gated rule can never apply to a noun, so lexbedom always found zero parses. Fixed by
#      moving the homophone pair (DOMN/DOMV) onto the HEAD instead, so mrPrefixBe2 has a posV2
#      reading to attach to; the non-head (LEX) is a plain, unambiguous noun in this set instead.
#   7. Even after fix 6, lexbedom still found zero parses: mpr-groups/output-overwrite and
#      compounding/prefix-commute have genuinely CONFLICTING requirements on morphologicalRuleOrder
#      within one stratum. output-overwrite needs "linear" order to be observable at all (a v1
#      fixture requirement); prefix-commute's head-recursion (the prefix unapplying from the
#      compounding HEAD span before the compound itself unapplies) only succeeds under "unordered" --
#      confirmed by toggling the setting and watching lexbedom and yxpedz trade places. Resolved by
#      splitting the grammar into two Strata sharing the same CharacterDefinitionTable: "Main"
#      (unordered, everything else) and "MprGroups" (linear, only the two mpr-groups constructs).
#
# Findings 2-7 are documented at their point of relevance in grammar.xml as well. None required a
# harness change; all were resolved within the grammar itself once understood.

language: FusionalRealizationalMorphology
inspired_by: ["fusional inflectional-class morphology with stem suppletion, realizational rules, and ablaut-as-sole-exponent (typological pattern, not any specific language)"]
sources:
  - "WALS - Fusion, Exponence, Inflectional Synthesis in Inflectional Morphology chapters"
  - "typological literature on suppletion - inflectional classes, syncretism, principal parts"
requires: []
words:
  - word: mun
    note: STEM's default (unrestricted) allomorph, bare -- no person feature assigned, so there is no StemName region to fail.
    parses:
      - signature: "STEM|mun"
        gloss: bring
        rules: []
        exercises:
          - "Stem names"

  - word: muno
    note: STEM default allomorph + P1 -- once ANY person feature is assigned, snP1P2/snP1P3's regions jointly exhaust {1,2,3}, so the region-less default allomorph can never combine with a person suffix at all.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: muns
    note: STEM default allomorph + P2 -- same reasoning as muno.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: munt
    note: STEM default allomorph + P3 -- same reasoning as muno.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: mano
    note: STEM's snP1P2-restricted allomorph "man" + P1 ("-o") -- P1 is in snP1P2's region {1,2}.
    parses:
      - signature: "STEM+P1|mano"
        gloss: bring-1SG
        rules: [mrPers1]
        exercises:
          - "Stem names"

  - word: mans
    note: STEM's snP1P2-restricted allomorph "man" + P2 ("-s") -- P2 is in snP1P2's region {1,2}.
    parses:
      - signature: "STEM+P2|mans"
        gloss: bring-2SG
        rules: [mrPers2]
        exercises:
          - "Stem names"

  - word: mant
    note: STEM's snP1P2-restricted allomorph "man" + P3 -- P3 is NOT in snP1P2's region {1,2} -- zero parses.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: man
    note: STEM's snP1P2-restricted allomorph, bare -- no person feature assigned means no region is satisfied, so this stemName-governed allomorph fails standalone (unlike the default allomorph's "mun").
    expect_fail: true
    exercises:
      - "Stem names"

  - word: mino
    note: >-
      STEM's snP1P3-restricted allomorph "min" + P1 -- P1 is in snP1P3's region {1,3}, AND also in
      snP1P2's region {1,2}: the shared-region row, proving 1st-person overlap between the two stem
      names doesn't spuriously block either one.
    provenance: "W5, StemName selection + default-stem fallback"
    parses:
      - signature: "STEM+P1|mino"
        gloss: bring-1SG
        rules: [mrPers1]
        exercises:
          - "Stem names"

  - word: mins
    note: STEM's snP1P3-restricted allomorph "min" + P2 -- P2 is NOT in snP1P3's region {1,3} -- zero parses.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: mint
    note: STEM's snP1P3-restricted allomorph "min" + P3 -- P3 is in snP1P3's region {1,3}.
    parses:
      - signature: "STEM+P3|mint"
        gloss: bring-3SG
        rules: [mrPers3]
        exercises:
          - "Stem names"

  - word: min
    note: STEM's snP1P3-restricted allomorph, bare -- fails standalone for the same reason "man" does.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: fer
    note: FER ("carry"), bare, no lexical head features at all -- trivially valid, no rule touches it.
    parses:
      - signature: "FER|fer"
        gloss: carry
        rules: []
        exercises: []

  - word: ferid
    note: FER + RPAST (a RealizationalRule, no AffixTemplate/Slot wrapper needed) -- the root's own FS has no tense value at all, so RPAST's IsBlocked presence check finds nothing to collide with.
    provenance: "W5, RealizationalAffixProcessRule core mechanics + IsBlocked"
    parses:
      - signature: "FER+RPAST|ferid"
        gloss: carry-PST.REALIZ
        rules: [rrPast]
        exercises:
          - "RealizationalAffixProcessRule"

  - word: feres
    note: FER + TENSE ("-es", ordinary affix, sets tense=pres) -- pre-loads a tense value so the realizational rule's blocking check below has something to trip on.
    parses:
      - signature: "FER+TENSE|feres"
        gloss: carry-PRES
        rules: [mrTense]
        exercises:
          - "RealizationalAffixProcessRule"

  - word: feresid
    note: >-
      FER + TENSE + RPAST attempted together -- mrTense sets tense=pres first, then RPAST's IsBlocked
      check sees tense is ALREADY present (even though it's pres, not past) and blocks -- a
      value-equality mis-implementation would wrongly accept this; presence alone is what matters.
    expect_fail: true
    blocked_by: [rrPast]
    exercises:
      - "RealizationalAffixProcessRule"

  - word: duc
    note: DUC ("lead"), bare, regular member of famCarry -- no collision, trivially valid.
    parses:
      - signature: "DUC|duc"
        gloss: lead
        rules: []
        exercises: []

  - word: tul
    note: TUL ("carry.PST.SUPPL"), bare, irregular suppletive member of famCarry with tense lexically fixed to past -- direct lexical lookup never reaches CheckBlocking.
    parses:
      - signature: "TUL|tul"
        gloss: carry.PST.SUPPL
        rules: []
        exercises:
          - "RealizationalAffixProcessRule"

  - word: ducit
    note: >-
      DUC + PAST2 ("-it", sets tense=past) attempted -- the synthesized candidate's tense=past FS
      subsumes TUL's own lexically-fixed FS (family collision), so Word.CheckBlocking fires and
      substitutes in TUL's own shape; since that substituted shape ("tul") does not match the surface
      "ducit", the candidate is discarded. Zero parses.
    expect_fail: true
    blocked_by: [mrPast2]
    provenance: "W5, LexFamily blocks a more-general family member (Word.CheckBlocking)"
    exercises:
      - "RealizationalAffixProcessRule"

  - word: ducunt
    note: DUC + PL2 ("-unt", sets num=pl only, never touches tense) -- never collides with TUL's tense-only lexical fixing, so not blocked.
    parses:
      - signature: "DUC+PL2|ducunt"
        gloss: lead-PL
        rules: [mrPl2]
        exercises:
          - "RealizationalAffixProcessRule"

  - word: lob
    note: LOB ("praise"), bare.
    parses:
      - signature: "LOB|lob"
        gloss: praise
        rules: []
        exercises: []

  - word: gelobt
    note: LOB circumfixed "ge-...-t" (ge-...-t past-participle-plausible) -- simultaneous prefix+suffix wrapped around one copied stem span, both pieces contributed by the SAME rule/morpheme id.
    provenance: "W9.1 probe, AffixProcessRuleTests.CircumfixRules"
    parses:
      - signature: "GET+LOB|gelobt"
        gloss: PTCP-praise
        rules: [mrCircumfixGeT]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: lobh
    note: >-
      LOB + S3 ("-h", ordinary suffix, independent of the circumfix rule). S3's suffix is "-h", not
      "-s": isolated probing found that "-s" collided with mrPers2's own literal "-s" suffix (both
      apply freely to any posV root), spuriously double-analyzing every "-s"-suffixed posV word as
      both S3 and P2 -- see grammar.xml's mrSuffixS3 comment.
    parses:
      - signature: "LOB+S3|lobh"
        gloss: praise-3SG
        rules: [mrSuffixS3]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: gelobth
    note: LOB circumfixed AND suffixed with S3 in the same word -- proves the circumfix composes with an independent ordinary suffix rule.
    parses:
      - signature: "GET+LOB+S3|gelobth"
        gloss: PTCP-praise-3SG
        rules: [mrCircumfixGeT, mrSuffixS3]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: gelobthh
    note: A doubled S3 suffix -- no rule combination produces two trailing "h"s. Negative control, mirroring v1 affix-shapes/circumfix's own doubled-suffix negative row.
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: vic
    note: VIC ("conquer"), bare -- the perfect-stem shape (vici-plausible), no infix.
    parses:
      - signature: "VIC|vic"
        gloss: conquer
        rules: []
        exercises: []

  - word: vinc
    note: VIC's present stem, nasal-infixed ("vi" + "n" + "c") -- vincere-plausible; two MorphologicalInput parts (first 2 segments, then the remainder), "n" inserted between them.
    provenance: "W9.1 probe, AffixProcessRuleTests.InfixRules"
    parses:
      - signature: "VIC+PRESSTEM|vinc"
        gloss: conquer-PRES.STEM
        rules: [mrNasalInfix]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: pannox
    note: >-
      PAN (head, "bread") + NOX (nonhead, bare root) compounded head+nonhead -- NOX is homophonous
      across posN ("night") and posV ("harm"), so both are independently valid non-head roots for the
      same surface string: two genuinely distinct analyses. The compounding seam's boundary marker
      "+" is a BoundaryDefinition (not a plain segment, see grammar.xml's CharacterDefinitionTable
      comment); it renders as "+?" in the signature's shape half, matching v1 compounding's own
      "(pʰ)ut+?dat"-style rendering -- it is never part of the literal surface word text itself.
    parses:
      - signature: "PAN+NOXN|pan+?nox"
        gloss: bread-night
        rules: [mrCompoundHN]
        exercises:
          - "CompoundingRule"
      - signature: "PAN+NOXV|pan+?nox"
        gloss: bread-harm
        rules: [mrCompoundHN]
        exercises:
          - "CompoundingRule"

  - word: benox
    note: >-
      NOXV, be-prefixed, standalone (no compounding involved) -- proves mrPrefixBe1 itself works
      correctly in isolation, so panbenox's rejection below is specifically about the compounding
      non-head-must-be-a-root constraint, not some defect in the prefix rule itself.
    parses:
      - signature: "BEPFX1+NOXV|benox"
        gloss: PST-harm
        rules: [mrPrefixBe1]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: panbenox
    note: >-
      PAN + be-prefixed NOX compounded head+nonhead -- the non-head span "benox" is prefix+root, NOT
      a bare root, and CompoundingRule's analysis-side search requires the non-head to be a bare root
      (computational-complexity reasons, per AnalysisCompoundingRule.cs) -- the prefix is discarded as
      an invalid analysis rather than recursively re-applied. Zero parses.
    expect_fail: true
    blocked_by: [mrCompoundHN]
    provenance: "P3, CompoundingRuleTests.SimpleRules reconfiguration 3 (non-head-not-root variant)"
    exercises:
      - "CompoundingRule"

  - word: pandex
    note: PAN + "dex" -- "dex" is neither a root nor any rule's output, so no compound analysis exists at all.
    expect_fail: true
    exercises:
      - "CompoundingRule"

  - word: lexdom
    note: >-
      LEX (nonhead, "law", posN2 only) + DOM (head, bare) compounded nonhead+head -- DOM is
      homophonous across posN2 ("house") and posV2 ("tame"), so both are independently valid head
      roots for the same surface string (the mirror image of Set 1's ambiguity, which sat on the
      non-head instead).
    parses:
      - signature: "LEX+DOMN|lex+?dom"
        gloss: law-house
        rules: [mrCompoundNH]
        exercises:
          - "CompoundingRule"
      - signature: "LEX+DOMV|lex+?dom"
        gloss: law-tame
        rules: [mrCompoundNH]
        exercises:
          - "CompoundingRule"

  - word: lexbedom
    note: >-
      LEX (nonhead) + be-prefixed DOM (head) compounded nonhead+head -- here the PREFIX attaches to
      the HEAD, not the non-head, and CompoundingRule's non-head-must-be-a-root requirement never
      constrains the head span at all, so this succeeds where panbenox failed: the prefix unapplies
      cleanly from the head span "bedom" -- but mrPrefixBe2 requires posV2, so only DOM's VERB reading
      (DOMV, "tame") is prefix-eligible; the noun reading (DOMN) can never combine with the prefix at
      all, so unlike lexdom's bare-head ambiguity, this word has exactly one analysis, not two. The
      prefix commutes with compounding rule ordering exactly as v1's own prefix-commute fixture pins.
    provenance: "P3, CompoundingRuleTests.SimpleRules reconfiguration 3 (prefix-commute variant)"
    parses:
      - signature: "LEX+BEPFX2+DOMV|lex+?bedom"
        gloss: law-PST-tame
        rules: [mrCompoundNH, mrPrefixBe2]
        exercises:
          - "CompoundingRule"

  - word: lexbex
    note: LEX + "bex" -- "bex" is neither DOM nor any valid prefixed-head shape, so no compound analysis exists.
    expect_fail: true
    exercises:
      - "CompoundingRule"

  - word: ped
    note: PED ("foot"), bare -- no MPR feature preset on this lexical entry, trivially valid.
    parses:
      - signature: "PED|ped"
        gloss: foot
        rules: []
        exercises: []

  - word: gofz
    note: >-
      GOF ("gof", introduced in full below with its ruleFeatures preset) + mrEndZ directly, with
      NEITHER mrThemeX NOR mrThemeY intervening -- GOF's own lexically-preset mprPedA reaches
      mrEndZ's requiredMPRFeatures="mprPedA" gate untouched, so this succeeds. The control for
      "ygofz" below: same root, same final suffix, the only difference is whether a
      ThemeGroup-overwriting rule sits in between. Placed here, ahead of GOF's own narrative
      introduction, because the paired severance witness on "ygofz" requires it to be the FIRST
      word in this file whose outcome differs under either of two specific severances -- see
      "ygofz"'s own note.
    parses:
      - signature: "GOF+ENDZ|gofz"
        gloss: gof-END
        rules: [mrEndZ]
        exercises:
          - "MPR features/groups"

  - word: ygofz
    note: >-
      GOF + mrThemeY + mrEndZ -- mrThemeY's own MorphologicalOutput MPRFeatures="mprPedB" write puts
      mprPedB into ThemeGroup's newly-written set, and MprFeatureSet.AddOutput's overwrite step drops
      every OTHER ThemeGroup member not in that set -- including GOF's own lexically-preset mprPedA,
      even though GOF never lost it by declaration, only by a later rule's write. mrEndZ's
      requiredMPRFeatures="mprPedA" then fails: zero parses, despite GOF genuinely carrying mprPedA
      at the lexical entry. This is the AbsentGatedForm witness for BOTH MPR writers onto this same
      reader: severing mrThemeY's own MorphologicalOutput.MPRFeatures (so the write, and the
      overwrite it triggers, never happens at all) leaves GOF's preset mprPedA untouched and this
      parses exactly as "gofz" does; severing mrEndZ's own requiredMPRFeatures (so the gate no longer
      needs mprPedA at all) unblocks it independently, to the identical result -- the same word,
      the same successful parse, from two unrelated severances. This word is placed immediately
      after "gofz" and before "xped"/"yxpedz" (the mpr-groups section's own earlier, unrelated
      Overwrite/required-MPR demonstrations) deliberately: FindPairedWitness's severance ledger
      reports the FIRST word in file order whose outcome differs under a given mutation, and
      "xpedz"/"yxpedz" already differ under these same two severances (in the OPPOSITE, non-paired
      direction and the un-paired reader-only direction respectively) -- if "ygofz" sat after them,
      its own paired flip would never surface as either interface's recorded example.
    expect_fail: true
    blocked_by: [mrEndZ]
    exercises:
      - "MPR features/groups"
    # Claims the McDc:AbsentGatedForm cell of docs/dataflow-coverage-plan.md's obligation matrix.
    # DataflowClaimGate checks this against conformance/dataflow-obligations.tsv, never trusts it,
    # and recomputes severing/before/after by re-severing the writer and reader named in the ledger
    # row -- the inline values below are what it recomputed against, not what it trusts blindly.
    claimed_cells:
      - cell: "MorphologicalPhonologicalRuleFeature::MorphologicalOutput.MPRFeatures->MorphologicalInput.requiredMPRFeatures::McDc:AbsentGatedForm"
        severing: >-
          MPRFeatures across every MorphologicalOutput (the one that matters here is mrThemeY's own
          "mprPedB" write), as the writer, or mrEndZ's MorphologicalInput.requiredMPRFeatures="mprPedA"
          gate, as the reader -- severing either alone unblocks this word
        before: "ok::-"
        after: "ok::THEMEY+GOF+ENDZ|ygofz"
        distinct_from: gofz
        proof: >-
          ygofz is GOF (lexically preset with mprPedA) run through mrThemeY then mrEndZ; with both
          constructs intact, mrThemeY's own write triggers ThemeGroup's overwrite semantics
          (MprFeatureSet.AddOutput) and drops GOF's preset mprPedA before mrEndZ's gate is ever
          checked, so this has zero parses (ok::-). Removing either the writer (mrThemeY's own
          MorphologicalOutput.MPRFeatures, so the overwrite-triggering write never happens) or the
          reader (mrEndZ's requiredMPRFeatures, so the gate no longer needs mprPedA) lets mrEndZ
          apply anyway, producing THEMEY+GOF+ENDZ|ygofz -- the AbsentGatedForm arm: the required
          feature is ABSENT (from the derivation's accumulated state, though never from GOF's own
          declaration) and the rule's requirement GATES on it. gofz (GOF+ENDZ with no mrThemeY at
          all) is the control that shows mrEndZ applies normally once mprPedA actually survives to
          the gate, so ygofz's block is attributable to mrThemeY's overwrite, not to mrEndZ never
          applying at all.

  - word: xped
    note: PED prefixed by mrThemeX ("x-", sets MPR feature mprPedA).
    provenance: "W3.1, MprFeatureGroupOutput.Overwrite in MPR output accumulation"
    parses:
      - signature: "THEMEX+PED|xped"
        gloss: THEME.A-foot
        rules: [mrThemeX]
        exercises:
          - "MPR features/groups"

  - word: yxped
    note: PED prefixed by mrThemeX then mrThemeY ("y-", sets mprPedB) -- ThemeGroup's outputType="overwrite" means mrThemeY's own output DROPS mprPedA rather than accumulating it alongside mprPedB.
    parses:
      - signature: "THEMEY+THEMEX+PED|yxped"
        gloss: THEME.B-THEME.A-foot
        rules: [mrThemeX, mrThemeY]
        exercises:
          - "MPR features/groups"

  - word: xpedz
    note: PED prefixed by mrThemeX then suffixed by mrEndZ (requiredMPRFeatures="mprPedA") -- mprPedA is still present (only mrThemeX applied), so mrEndZ's requirement is satisfied.
    parses:
      - signature: "THEMEX+PED+ENDZ|xpedz"
        gloss: THEME.A-foot-END
        rules: [mrThemeX, mrEndZ]
        exercises:
          - "MPR features/groups"

  - word: yxpedz
    note: >-
      PED prefixed by mrThemeX then mrThemeY then suffixed by mrEndZ -- the DISTINGUISHING row: after
      mrThemeY, ThemeGroup's Overwrite semantics have already dropped mprPedA, so mrEndZ's
      requiredMPRFeatures="mprPedA" fails. Zero parses. A pre-fix "flat union" mis-implementation
      would wrongly accept this.
    expect_fail: true
    blocked_by: [mrEndZ]
    exercises:
