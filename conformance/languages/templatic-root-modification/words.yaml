# HAND DERIVATION (authored BEFORE running the oracle -- see grammar.xml for the rule definitions
# these derivations reason from).
#
#   1. katab -> KTB bare, no suffix at all. No C_C seam exists anywhere in "katab" (k-a-t-a-b
#      alternates C/V throughout), so prEpenthesis (posV-scoped) has no site to fire at.
#        -> KTB|katab, rules: []
#   2. katabit -> KTB + P1SG ("-t"): underlying concatenation is "katab"+"t" = "katabt", whose only
#      C_C seam is b-t (positions 5-6). prEpenthesis (Simultaneous, obligatory wherever its
#      environment holds) inserts a linking "i" there -> "katabit".
#        -> KTB+P1SG|katabit, rules: [mrPerf1sg, prEpenthesis]
#   3. kataba -> KTB + P3SG ("-a"): underlying "katab"+"a" = "kataba", vowel-final suffix creates no
#      C_C seam at all (b-a is C-V) -> prEpenthesis does not fire, contrasting with katabit and
#      proving the rule is seam-conditioned, not blanket-obligatory on every suffixed word.
#        -> KTB+P3SG|kataba, rules: [mrPerf3sg]
#   4. sapr -> SPR + FormII: MorphologicalInput splits "spr" into fIIFirst="s", fIIRest="pr";
#      InsertSimpleContext inserts VowelA ("a") between them -> "s"+"a"+"pr" = "sapr". posFormII is
#      never scoped to prEpenthesis, so the resulting p-r medial cluster is left exactly as the rule
#      produces it (this invented language tolerates medial CC in FormII output; only the KTB
#      person-suffix paradigm has an obligatory seam-epenthesis rule).
#        -> SPR+FORMII|sapr, rules: [mrFormII]
#   5. samm -> SMM + FormII attempted: same InsertSimpleContext split ("s"+"a"+"mm" = "samm"), but
#      SMM's C2=C3 ("m"="m") is exactly the OCP-fragile shape the MorphemeCoOccurrenceRule excludes
#      FormII from co-occurring with (primaryMorpheme="mrFormII", otherMorphemes="eSmm") -> zero
#      parses, since "samm" has no other possible analysis (SMM's own bare shape is "smm", not
#      "samm").
#        -> expect_fail, blocked_by: [mrFormII]
#
# The remaining words reuse these same five mechanisms (KTB's person-suffix/epenthesis pair, FormII's
# InsertSimpleContext, the OCP exclusion) on independent lexical/rule material -- the hollow-root
# internal passive (ModifyFromInput), the HLK stem-name paradigm (StemName region algebra, mirroring
# fusional-realizational-morphology's own mun/man/min proof exactly), the Simultaneous-vs-Iterative feeding/bleeding
# contrast pair, word-initial prothesis, and gemination-as-expansion -- or are expect_fail words whose
# signature is the empty set. See PROTOCOL.md section 3 for the `-`/empty-signature convention.
#
# Reconciliation against the oracle (self-check): all 5 words above matched the hand derivation on
# the first self-check run once the grammar's isolation discipline (one POS per phonological-rule
# demo, requiredPartsOfSpeech on every subrule) was in place, and 23 of 25 words in the file matched
# outright with no further disagreement. The remaining 2 (gigugu, gigugi) matched on SIGNATURE but
# not on the traced rules: list -- both words' fired-rule set traced as [prSimulFeeding,
# prIterFeedingControl] together, not just the one whose candidate actually survives. This is
# TraceRuleAttributor's own documented "ambiguous word" limitation (see that class's doc comment in
# src/SIL.Machine.Morphology.HermitCrab.Conformance/V2/TraceRuleAttributor.cs): surface "gigugu"/
# "gigugi" both unify against BOTH the eFeedSimul and eFeedIter lexical candidates (they share the
# identical underlying shape "gigigi"), and even though only one candidate's synthesis-confirm
# ultimately matches the target surface, the OTHER candidate's own (failed) confirm attempt still
# fires its rule before being discarded, and the word-level trace walk unions rules fired across
# every attempted candidate, not just the surviving one. The trace is authoritative per this task's
# discipline, so rules: was widened to the honest traced union on both words (see their own notes).

language: TemplaticRootModification
inspired_by: ["templatic root-and-pattern morphology: non-concatenative infixation, internal ablaut, and suppletive stem-name alternation (typological pattern, not any specific language)"]
sources:
  - "WALS - Reduplication and templatic morphology typology chapters"
  - "typological literature on root-and-pattern phonology and morphology, and the Obligatory Contour Principle"
  - "typological literature on templatic verbal morphology and the HermitCrab reference corpus"
requires: [phonology]
words:
  - word: katab
    note: KTB bare root, no suffix -- no C_C seam exists, so prEpenthesis has no site to fire at.
    parses:
      - signature: "KTB|katab"
        gloss: write
        rules: []
        exercises: []

  - word: katabit
    note: >-
      KTB + P1SG ("-t"): underlying "katab"+"t" = "katabt" has one C_C seam (b-t), obligatorily
      broken by Simultaneous-mode epenthesis -- the raw unepenthesized concatenation never itself
      surfaces (see "katabt" below).
    provenance: "P13 synthetic oracle: Simultaneous epenthesis; confirmed live-oracle bug on row 0 (see README)"
    parses:
      - signature: "KTB+P1SG|katabit"
        gloss: write-1SG.PERF
        rules: [mrPerf1sg, prEpenthesis]
        exercises:
          - "RewriteRule Simultaneous"
          - "MorphologicalOutputAction: CopyFromInput/InsertSegments"

  - word: katabt
    note: The raw, unepenthesized concatenation of katab+"-t" -- prEpenthesis is obligatory wherever its C_C environment holds, so this surface form can never itself be a valid analysis (see katabit).
    expect_fail: true
    blocked_by: [prEpenthesis]
    exercises:
      - "RewriteRule Simultaneous"

  - word: kataba
    note: KTB + P3SG ("-a"), a vowel-initial suffix -- no C_C seam forms (b-a is C-V), so epenthesis correctly does not fire, contrasting with katabit.
    parses:
      - signature: "KTB+P3SG|kataba"
        gloss: write-3SG.PERF
        rules: [mrPerf3sg]
        exercises:
          - "MorphologicalOutputAction: CopyFromInput/InsertSegments"

  - word: spr
    note: SPR bare root (posFormII), no FormII applied -- a plain, unrestricted control.
    parses:
      - signature: "SPR|spr"
        gloss: count
        rules: []
        exercises: []

  - word: sapr
    note: >-
      SPR + FormII: InsertSimpleContext splits the root into a first segment and the remainder,
      inserting a fully-specified VowelA class between them -- "s"+"a"+"pr" = "sapr". This is
      ZERO-coverage-today's home construct: no other v2 grammar carries InsertSimpleContext.
      posFormII is never scoped to prEpenthesis, so the resulting p-r cluster is left as-is (an
      invented-language phonotactic difference from the KTB paradigm, not an omission).
    parses:
      - signature: "SPR+FORMII|sapr"
        gloss: count-FORMII
        rules: [mrFormII]
        exercises:
          - "MorphologicalOutputAction: ModifyFromInput/InsertSimpleContext"

  - word: smm
    note: SMM bare root (posFormII), no FormII applied -- proves the root is otherwise perfectly valid on its own; only combining it with FormII is excluded (see samm below).
    parses:
      - signature: "SMM|smm"
        gloss: curse
        rules: []
        exercises: []

  - word: samm
    note: >-
      SMM + FormII attempted: the same InsertSimpleContext split as sapr ("s"+"a"+"mm" = "samm"),
      but SMM's C2=C3 ("m"="m") is exactly the Obligatory-Contour-Principle-fragile root shape the
      MorphemeCoOccurrenceRule excludes FormII from co-occurring with -- zero parses (no other
      analysis exists for "samm").
    expect_fail: true
    blocked_by: [mrFormII]
    exercises:
      - "MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"

  - word: qal
    note: QWL ("say") hollow root, bare, active/citation form -- qala-plausible.
    parses:
      - signature: "QWL|qal"
        gloss: say
        rules: []
        exercises: []

  - word: qil
    note: >-
      QWL's internal passive, realized ENTIRELY by changing the root's own medial vowel ("a"->"i")
      via ModifyFromInput -- no affix at all. qila ("it was said")-plausible: a genuinely
      attested templatic phenomenon, not an invented mechanism. Second half of the zero-coverage
      ModifyFromInput/InsertSimpleContext construct pair (paired with sapr's InsertSimpleContext use
      above).
    parses:
      - signature: "QWL+PASS|qil"
        gloss: say-PASS
        rules: [mrPassive]
        exercises:
          - "MorphologicalOutputAction: ModifyFromInput/InsertSimpleContext"

  - word: halak
    note: HLK's default (unrestricted) allomorph, bare -- no aspect feature assigned at all, so there is no StemName region to fail.
    parses:
      - signature: "HLK|halak"
        gloss: go
        rules: []
        exercises:
          - "Stem names"

  - word: halaku
    note: HLK default allomorph + IMPF ("-u") -- once ANY aspect feature is assigned, snImpfPerf/snPerfJuss's regions jointly exhaust {impf,perf,juss}, so the region-less default allomorph can never combine with an aspect suffix at all.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: hilaku
    note: HLK's snImpfPerf-restricted allomorph "hilak" + IMPF ("-u") -- impf is in snImpfPerf's region {impf,perf}.
    parses:
      - signature: "HLK+IMPF|hilaku"
        gloss: go-IMPF
        rules: [mrAspImpf]
        exercises:
          - "Stem names"

  - word: hilaka
    note: HLK's snImpfPerf-restricted allomorph "hilak" + JUSS ("-a") -- juss is NOT in snImpfPerf's region {impf,perf} -- zero parses.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: hilaki
    note: >-
      HLK's snImpfPerf-restricted allomorph "hilak" + PERF ("-i") -- perf is in snImpfPerf's region
      {impf,perf} AND also in snPerfJuss's region {perf,juss}: the shared-region row, proving the
      1st-person-equivalent overlap between the two stem names doesn't spuriously block either one
      (paired with hulaki below).
    provenance: "W5, StemName selection + default-stem fallback"
    parses:
      - signature: "HLK+PERF|hilaki"
        gloss: go-PERF
        rules: [mrAspPerf]
        exercises:
          - "Stem names"

  - word: hulaka
    note: HLK's snPerfJuss-restricted allomorph "hulak" + JUSS ("-a") -- juss is in snPerfJuss's region {perf,juss}.
    parses:
      - signature: "HLK+JUSS|hulaka"
        gloss: go-JUSS
        rules: [mrAspJuss]
        exercises:
          - "Stem names"

  - word: hulaku
    note: HLK's snPerfJuss-restricted allomorph "hulak" + IMPF ("-u") -- impf is NOT in snPerfJuss's region {perf,juss} -- zero parses.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: hulaki
    note: HLK's snPerfJuss-restricted allomorph "hulak" + PERF ("-i") -- the shared-region partner of hilaki above (perf is in BOTH regions), and both allomorphs must independently validate.
    parses:
      - signature: "HLK+PERF|hulaki"
        gloss: go-PERF
        rules: [mrAspPerf]
        exercises:
          - "Stem names"

  - word: gigugu
    note: >-
      FEEDSIM ("gigigi", posSimulDemo) under prSimulFeeding (Simultaneous): both candidate target
      positions (3 and 5) have their environment checked against the SAME pre-rewrite snapshot, so
      BOTH rewrite -> "gigugu". Simultaneous can never feed/bleed another match in the same pass.
      Reconciliation finding: the traced rules: set for BOTH gigugu and gigugi includes both
      prSimulFeeding AND prIterFeedingControl, not just the one whose candidate survives -- this is
      TraceRuleAttributor's own documented "ambiguous word" limitation (see that class's doc
      comment): the eFeedIter/eFeedSimul candidates are BOTH attempted during analysis (surface
      "gigugu" unifies against both lexical entries' shared underlying shape "gigigi"), and even
      though only the FEEDSIM candidate's synthesis-confirm ultimately matches "gigugu", the OTHER
      candidate's own confirm attempt (which fires its own rule before failing to match the target
      surface) is traced too -- the word-level trace walk unions rules fired across every attempted
      candidate, not just the winning one. Declared rules: below is the honest traced union, per the
      task brief's discipline ("the TRACE is authoritative").
    provenance: "P13 synthetic oracle, RewriteRuleTests.MultipleApplicationRules: Simultaneous blocks forward feeding"
    parses:
      - signature: "FEEDSIM|gigugu"
        gloss: sway
        rules: [prSimulFeeding, prIterFeedingControl]
        exercises:
          - "RewriteRule Simultaneous"

  - word: gigugi
    note: >-
      FEEDITER ("gigigi", posIterDemo) under prIterFeedingControl (Iterative, the default): position
      3 rewrites first (against the original shape), but by the time position 5 is checked its own
      environment now reads position 3's ALREADY-rewritten value ("u", not the required front "i"),
      so position 5 is NOT rewritten -> "gigugi". The mirror image of gigugu's all-at-once result.
      Same traced-union finding as gigugu applies here (see that word's note) -- the FEEDSIM
      candidate's own failed confirm attempt also traces prSimulFeeding.
    provenance: "Iterative control sibling for rewrite/simultaneous-feeding"
    parses:
      - signature: "FEEDITER|gigugi"
        gloss: twirl
        rules: [prIterFeedingControl, prSimulFeeding]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"

  - word: gigigi
    note: >-
      Bare "gigigi" is ambiguous between the FEEDSIM and FEEDITER lexical candidates, but each
      root's own rule is obligatory wherever its environment holds -- FEEDSIM's candidate
      synthesis-confirms to "gigugu" (not "gigigi"), and FEEDITER's candidate synthesis-confirms to
      "gigugi" (not "gigigi") -- so neither candidate survives. Zero parses in both modes, exactly
      mirroring v1's own bare-root negative control.
    expect_fail: true
    blocked_by: [prSimulFeeding, prIterFeedingControl]
    exercises:
      - "RewriteRule Simultaneous"
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"

  - word: iktub
    note: >-
      KTUB ("write.IMP", posProthesis) bare root "ktub" begins with a word-initial 2-consonant
      cluster ("kt") -- prProthesis obligatorily breaks it with a prothetic "i", a word-initial
      prothesis pattern (cf. Form I imperative "uktub").
    provenance: "P1, RewriteRuleTests.BoundaryRules (bare-root word-initial epenthesis)"
    parses:
      - signature: "KTUB|iktub"
        gloss: write.IMP
        rules: [prProthesis]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"

  - word: ktub
    note: The raw, un-prothesized underlying shape -- prProthesis is obligatory whenever a word begins with a consonant cluster, so this surface form can never itself be a valid analysis.
    expect_fail: true
    blocked_by: [prProthesis]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"

  - word: radda
    note: >-
      RAD ("kindle", posGeminate) bare root "rada" -- prGeminate unconditionally expands its single
      "d" into two identical segments (1 segment -> 2 segments, no Environment at all), modeling
      gemination as spreading. The raw unexpanded "rada" can never itself surface (see rada below).
    provenance: "W9.2 probe, RewriteRuleTests.ExpandRules"
    parses:
      - signature: "RAD|radda"
        gloss: kindle
        rules: [prGeminate]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"

  - word: rada
    note: The raw, un-geminated underlying shape -- prGeminate is unconditional (obligatory wherever "d" appears), so this surface form can never itself be a valid analysis.
    expect_fail: true
    blocked_by: [prGeminate]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
