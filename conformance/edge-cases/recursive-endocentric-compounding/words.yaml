  - word: tevimaflisra
    note: >-
      THE recursive/self-feeding witness: ROOT1+ROOT2 (cr1's own first application, forming a
      posRoot-headed compound) then re-entering cr1's own head/non-head search a SECOND time with
      ROOT3 -- (ROOT1+ROOT2)+ROOT3, exactly the "compound's own output PoS re-enters its own input
