      regardless of any word -- see the paired rust/crates/pg-foma/tests/
      cover_recursive_endocentric_compounding.rs test), but because the oracle's own
      `pg_rules::stratum::AnalyzerConfig::max_stem_count` (hardcoded to 2 inside
      `pg_parse::Morpher::parse_word_opts`, mirroring C#'s `Morpher.MaxStemCount` default) is a
      SEPARATE, independently-discovered resource ceiling: "at most one non-head may ever be split
      off, so a word can be de-compounded once, never recursively re-compounded" (that field's own
      doc, rust/crates/pg-rules/src/stratum.rs). This word is the fixture's load-bearing REFUSAL
      pin: both the capability gate (structural, unconditional) and the confirm-engine's own
      resource ceiling (empirical, word-triggered) currently agree that genuine self-feeding
      compounding is unreached -- this is the honest, CURRENT behavior this fixture exists to pin,
      not a design goal being asserted.
    provenance: "docs/conformance/representative-typology-basis.md S1.2.1; rust/crates/pg-rules/src/stratum.rs AnalyzerConfig::max_stem_count doc"
