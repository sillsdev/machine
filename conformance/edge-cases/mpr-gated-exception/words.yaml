# agglutinative-Austronesian reference corpus's pathology mimic -- see STAGING.md and grammar.xml's
# own header comment. Originally authored and verified against PanGloss's Rust engine only
# (`pg_parse::Morpher`, driven directly -- see STAGING.md's "Verification" section); signatures were
# transcribed verbatim from that run, not hand-derived. Since then also verified against this repo's
# own C# HermitCrab engine (the founding oracle): every signature, every parse's traced `rules:`
# list, and the `vokadan` expect_fail all hold under self-check mode
# (ConformanceFixtureGateTests.EveryConformanceFixturePassesSelfCheck / `hc-conformance --fixtures
# conformance`, in-process XmlLanguageLoader + Morpher, no divergence found).
#
# Authoring note: an early draft gave every vowel (a/e/i/u/o) and several consonants (l/k/s/v/d) an
# IDENTICAL feature bundle (only `featPlace=vocalic`/`fPlaceOther` respectively distinguished them
# from other classes, not from each other) -- `pg_parse`'s own shape-rendering correctly collapsed
# feature-identical segments into a bracketed alternates class (e.g. "t[aeiuo][lvd][aeiuo][ks]"
# instead of the literal "tulik"), obscuring the actual pin. Fixed by giving every segment a fully
# unique feature bundle (featHigh/featBack added for the vowels; featPlace values split apart for the
# consonants) -- see grammar.xml's own PhonologicalFeatureSystem comment. Every signature below is
# now literal.

language: Ranavu
inspired_by: ["synthetic agglutinative-Austronesian nasal-assimilation/deletion + MPR-exclusion probe (not modeling any real language)"]
sources:
  - "docs/conformance-staging-plan.md pathology catalog (agglutinative-Austronesian row)"
requires: [phonology]
words:
  - word: tulik
    note: TULIK bare root, no prefix -- a plain control.
    parses:
      - signature: "TULIK|tulik"
        rules: []

  - word: menulik
    note: >-
      TULIK + mrNPfx: underlying "meN+tulik" -- the placeholder nasal assimilates to alveolar "n"
      (prNasalAssimAlveolar, root-initial "t" is alveolar), then the now-real "n" triggers
      prObstruentDeletion on the following VOICELESS obstruent "t" -- "mentulik" -> "menulik". The
      deletion-junction model behind that agglutinative-Austronesian reference corpus's own
      meN+tulis -> menulis.
    provenance: "docs/conformance-staging-plan.md pathology catalog (agglutinative-Austronesian row): placeholder-nasal assimilation + junction deletion"
    parses:
      - signature: "NPFX+TULIK|menulik"
        rules: [mrNPfx, prNasalAssimAlveolar, prObstruentDeletion]
        # LeftToRightRewrite (constructs.txt row 29): prNasalAssimAlveolar/prObstruentDeletion both
        # carry no multipleApplicationOrder attribute, so pg-grammar's own loader
        # (load_rewrite_rule, rust/crates/pg-grammar/src/load.rs) gives each Dir::LeftToRight by
        # default -- and this word is the fixture's strongest positive witness: BOTH rules actually
        # fire in sequence (assimilation then deletion) to produce this surface form, not merely
        # present-but-unused. Previously untagged -- constructs.txt had no row for this
        # characteristic until G9 (sillsdev/machine PR #465) added row 29.
        exercises:
          - "RewriteRule direction (Dir): left-to-right"

  - word: balo
    note: BALO bare root -- a plain control.
    parses:
      - signature: "BALO|balo"
        rules: []

  - word: membalo
    note: >-
      BALO + mrNPfx: underlying "meN+balo" -- the placeholder nasal assimilates to bilabial "m"
      (prNasalAssimBilabial, root-initial "b" is bilabial); "b" is VOICED, not in the
      VoicelessObstruent class, so prObstruentDeletion does NOT fire and "b" survives --
      "membalo", not "memalo". The contrasting (non-deleting) half of the deletion-junction pair.
    provenance: "docs/conformance-staging-plan.md pathology catalog (agglutinative-Austronesian row): placeholder-nasal assimilation + junction deletion"
    parses:
      - signature: "NPFX+BALO|membalo"
        rules: [mrNPfx, prNasalAssimBilabial]

  - word: sanit
    note: SANIT bare root, no MPR feature -- a plain control for the MPR-exclusion pair below.
    parses:
      - signature: "SANIT|sanit"
        rules: []

  - word: sanitan
    note: SANIT + mrSuf ("-an") -- no MPR feature on this root, so mrSuf's excludedMPRFeatures="mprException" gate is vacuously satisfied and the rule applies normally.
    provenance: "docs/conformance-staging-plan.md pathology catalog (agglutinative-Austronesian row): MPR-gated rule exception (control)"
    parses:
      - signature: "SANIT+SUF|sanitan"
        rules: [mrSuf]

  - word: vokad
    note: VOKAD bare root (carries ruleFeatures="mprException") -- a plain control.
    parses:
      - signature: "VOKAD|vokad"
        rules: []

  - word: vokadan
    note: >-
      THE distinguishing row: VOKAD carries mprException, and mrSuf's MorphologicalInput excludes
      exactly that feature (excludedMPRFeatures="mprException") -- so "vokadan" (VOKAD + mrSuf) has
      NO valid derivation. An engine that ignores excludedMPRFeatures would wrongly accept this --
      the P6 flag-diacritics recall case in miniature (a corpus word's correct parse REQUIRES the
      exclusion to be honored).
    provenance: "docs/conformance-staging-plan.md pathology catalog (agglutinative-Austronesian row): MPR-gated rule exception"
    expect_fail: true
    blocked_by: [mrSuf]
    # Claims the McDc:PresentGatedForm cell of docs/dataflow-coverage-plan.md's obligation matrix.
    # DataflowClaimGate checks this against conformance/dataflow-obligations.tsv, never trusts it,
    # and recomputes severing/before/after by re-severing the writer and reader named in the ledger
    # row -- the inline values below are what it recomputed against, not what it trusts blindly.
    claimed_cells:
      - cell: "MorphologicalPhonologicalRuleFeature::LexicalEntry.ruleFeatures->MorphologicalInput.excludedMPRFeatures::McDc:PresentGatedForm"
        severing: >-
          either VOKAD's LexicalEntry.ruleFeatures="mprException" (the writer) or mrSuf's
          MorphologicalInput.excludedMPRFeatures="mprException" gate (the reader) -- severing
          either alone unblocks this word
        before: "ok::-"
        after: "ok::VOKAD+SUF|vokadan"
        distinct_from: sanitan
        proof: >-
          vokadan is VOKAD (carries mprException) + mrSuf; with both constructs intact the
          derivation is blocked (ok::-). Removing either the writer (VOKAD's ruleFeatures) or the
          reader (mrSuf's excludedMPRFeatures) lets the same derivation through, producing
          VOKAD+SUF|vokadan -- the PresentGatedForm arm: the feature is PRESENT on the root and the
          rule's exclusion GATES on it. sanitan (SANIT, no mprException) is the plain control that
          shows mrSuf fires normally when the feature is simply absent, so vokadan's block is
          attributable to the gate, not to mrSuf never applying at all.

  - word: vokadi
    note: >-
      VOKAD's actual correct derived form: mrSufAlt ("-i") carries no MPR gate at all, so it is
      the ONLY rule an mprException root can undergo -- the exception-honoring positive control
      that pairs with vokadan's negative one.
    provenance: "docs/conformance-staging-plan.md pathology catalog (agglutinative-Austronesian row): MPR-gated rule exception"
    parses:
      - signature: "VOKAD+SUFALT|vokadi"
        rules: [mrSufAlt]

  - word: menanukam
    note: >-
      THE distinguishing row for MorphologicalOutput.MPRFeatures->PhonologicalSubrule.excludedMPRFeatures:
      TANUK + mrNPfx + mrDelExclSrc, with the obstruent DELETED ("menanukam" instead of
      "mentanukam"). With both constructs intact, mrDelExclSrc's own MPR write triggers
      prObstruentDeletion's excludedMPRFeatures="mprAffixDelExcl" gate and blocks the deletion, so
      this surface has zero parses even though the nasal+voiceless-obstruent environment
      (prNasalAssimAlveolar having already run) is otherwise identical to menulik's own deleting
      case. Removing either mrDelExclSrc's own MorphologicalOutput.MPRFeatures write (so the
      exclusion-triggering write never happens) or prObstruentDeletion's own excludedMPRFeatures (so
      the gate no longer needs mprAffixDelExcl at all) unblocks it independently, to the identical
      successful (deleting) parse -- the same word, from two unrelated severances. mentanukam
      (below) is the control showing the affix combination is otherwise well-formed. Placed AHEAD of
      mentanukam deliberately: severing either construct ALSO flips mentanukam (pass->fail), and the
      sweep reports whichever word differs FIRST in file order, so menanukam has to sit earlier than
      mentanukam for its own fail->pass flip to be the one reported.
    expect_fail: true
    blocked_by: [prObstruentDeletion]
    claimed_cells:
      - cell: "MorphologicalPhonologicalRuleFeature::MorphologicalOutput.MPRFeatures->PhonologicalSubrule.excludedMPRFeatures::McDc:PresentGatedForm"
        severing: >-
          either mrDelExclSrc's own MorphologicalOutput.MPRFeatures="mprAffixDelExcl" write (the
          writer) or prObstruentDeletion's own PhonologicalSubrule.excludedMPRFeatures="mprAffixDelExcl"
          gate (the reader) -- severing either alone unblocks this word
        before: "ok::-"
        after: "ok::NPFX+TANUK+DELEXCLSRC|menanukam;NPFX+TANUK+DELEXCLSRC|menanukam"
        distinct_from: mentanukam
        proof: >-
          menanukam is TANUK run through mrNPfx and mrDelExclSrc (which confers mprAffixDelExcl) then
          attempting prObstruentDeletion; with both constructs intact the deletion is blocked (zero
          parses for the deleted surface). Removing either the writer (mrDelExclSrc's own
          MorphologicalOutput.MPRFeatures) or the reader (prObstruentDeletion's excludedMPRFeatures)
          lets the deletion through, producing NPFX+TANUK+DELEXCLSRC|menanukam -- the PresentGatedForm
          arm: the feature is PRESENT (conferred by the affix, never by TANUK's own declaration) and
          the rule's exclusion GATES on it.

  - word: mentanukam
    note: >-
      TANUK + mrNPfx + mrDelExclSrc ("-am"): underlying "meN+tanuk+am" -- the placeholder nasal
      assimilates to alveolar "n" (prNasalAssimAlveolar, root-initial "t" is alveolar), but
      mrDelExclSrc's own MorphologicalOutput MPRFeatures="mprAffixDelExcl" write means
      prObstruentDeletion's excludedMPRFeatures="mprAffixDelExcl" gate now blocks the deletion that
      would otherwise fire on the following voiceless obstruent "t" -- so "t" survives:
      "mentanukam", not "menanukam". The control for menanukam (above). Two identical entries below:
      the Main stratum is morphologicalRuleOrder="unordered", so mrNPfx (prefix) and mrDelExclSrc
      (suffix) -- independent of each other's position -- are reached via two distinct derivation
      orders that happen to produce the byte-identical surface and signature, exactly like any other
      pair of non-conflicting affixes under this stratum's own ordering discipline.
    parses:
      - signature: "NPFX+TANUK+DELEXCLSRC|mentanukam"
        rules: [mrNPfx, mrDelExclSrc, prNasalAssimAlveolar]
      - signature: "NPFX+TANUK+DELEXCLSRC|mentanukam"
        rules: [mrDelExclSrc, mrNPfx, prNasalAssimAlveolar]

  - word: tanuk
    note: TANUK bare root, no prefix or suffix -- a plain control.
    parses:
      - signature: "TANUK|tanuk"
        rules: []
