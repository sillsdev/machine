      - remove_phoneme:
          guid: 642fff7b-b0d2-42a4-9d37-dc88dd40113c
          assert_representations: [t]
          require_unreferenced: true
    expect:
      xample_projection: same_as_base
      hc_analyses: same_as_base
      inferred_segments: [t]
