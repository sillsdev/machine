# oracle-provenance: founding-oracle machine-commit=aab4c59819adb7b366915e09df2fb28c62b8c03a verified-date=2026-10-30
# Replayed on hc.dll at Machine aab4c598 (see README.md): the rows below are the oracle's own output.
# Synthetic; no real language.
# The grammar is the per-copy form HCLoader emits for a prefix entry whose one allomorph has two environments
# and two equal MoInflAffMsas (MergeMSAs off): two morphological rules, two allomorph copies (one per
# environment) in each, and one AllomorphCoOccurrenceRule per copy on both sides (HCLoader.cs:1165-1178 and
# 2212-2236). A loader that wired the prohibition to one allomorph copy per MSA (the first environment) would
# still parse tada/taba through the second environment copy.
language: AdhocProhibitionAffixEnvironmentCopies
inspired_by: ["a prefix allomorph with two environments and two affix MSAs compiles to one allomorph copy per MSA per environment; an ad hoc allomorph prohibition names the one prefix allomorph, and HCLoader attaches it to every copy"]
sources: ["HCLoader.cs:1160-1178 (LoadAffixProcessAllomorphs)", "HCLoader.cs:2212-2236 (LoadAllomorphCoOccurrenceRules)"]
requires: []
fieldworks_producible: true
words:
  - word: da
    note: >-
      Control: bare stem da parses.
    parses:
      - signature: "DA|da"
        rules: []
        exercises: ["MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"]
  - word: ba
    note: >-
      Control: bare stem ba parses.
    parses:
      - signature: "BA|ba"
        rules: []
        exercises: ["MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"]
  - word: ga
    note: >-
      Control: bare stem ga parses.
    parses:
      - signature: "GA|ga"
        rules: []
        exercises: ["MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"]
  - word: taga
    note: >-
      Control: ga has no prohibition, so the prefix attaches once per prefix MSA, both times through the before-consonant environment copy (the after-a copy never matches word-initially).
    parses:
      - signature: "TA1+GA|taga"
        rules: [mrTa1]
        exercises: ["MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"]
      - signature: "TA2+GA|taga"
        rules: [mrTa2]
        exercises: ["MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"]
  - word: tada
    note: >-
      Prefix first: the prohibition ta- ~ da is declared on all four copies of the prefix allomorph (two MSAs x two environments). The only copies that match here are the before-consonant ones; both are excluded, so the word has no analysis.
    expect_fail: true
    exercises: ["MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"]
  - word: taba
    note: >-
      Stem first: the prohibition ba ~ ta- is declared on ba once per prefix copy on the rest side. Both matching copies are excluded, so the word has no analysis.
    expect_fail: true
    exercises: ["MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"]
