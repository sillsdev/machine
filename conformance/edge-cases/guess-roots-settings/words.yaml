    expect_fail: true
    note: C# oracle observation with GuessRoots = false.
  - word: nuna
    parses:
    - signature: NUNA|nuna
      rules: []
    note: C# oracle observation with GuessRoots = false.
  - word: '!'
    expect_skip: true
    note: C# oracle observation with GuessRoots = false.
- name: guess-on
  morpher:
    GuessRoots: true
  words:
  - word: takuvuq
    parses:
    - signature: taku+INFL|takuvuq
      rules:
      - mrInfl
      guess: true
    - signature: taku+INFL|takuvuq
      rules:
      - mrInfl
      guess: true
    - signature: takuvuq|takuvuq
      rules: []
      guess: true
    - signature: takuvuq|takuvuq
      rules: []
      guess: true
    note: C# oracle observation with GuessRoots = true.
  - word: nuna
    parses:
    - signature: NUNA|nuna
      rules: []
    note: C# oracle observation with GuessRoots = true.
  - word: '!'
    expect_skip: true
    note: C# oracle observation with GuessRoots = true.
