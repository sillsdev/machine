# oracle-provenance: founding-oracle
# Signatures transcribed verbatim from the C# founding oracle (hc-conformance self-check, --propose)
# built from sillsdev/machine 18cf242f (the integrate-conformance-framework head, PR #480).
#
# Regression guard: a narrowing rule with a morpheme boundary in the MIDDLE of a three-segment
# target and a ONE-segment output, in a grammar with NO phonological feature system.
# prPostNasal: n + b -> m (nasal and boundary absorbed into the suffix-initial consonant; the shape
# of a real syllabary grammar whose "C + V -> fused character" rule has the boundary second). "kamo"
# is ambiguous between KAN+BO (rule applied) and KA+MO (underlying m). Here the boundary falls
# OUTSIDE the first |output| positions of the target, so even an engine that merges the first target
# segment into the surface node (string set {m, n}) still lets the root consume it; compare the two
# sibling probes where the boundary falls inside those positions and KAN+BO is lost.

language: BoundaryLeftoverInNarrowingLhsStrrep
inspired_by: ["synthetic boundary-in-target post-nasal probe (not modeling any real language)"]
sources:
  - "src/SIL.Machine.Morphology.HermitCrab/PhonologicalRules/NarrowAnalysisRewriteRuleSpec.cs"
requires: [phonology]
fieldworks_producible: true
words:
  - word: kamo
    note: KAN+BO (kan+bo -> kamo, nasal and boundary absorbed) and KA+MO (ka+mo, no rule).
    parses:
      - signature: "KA+MO|ka+?mo"
        rules: [mrSfxMo, prPostNasal]
      - signature: "KAN+BO|kamo"
        rules: [mrSfxBo, prPostNasal]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
          - "Boundary markers (CharacterDefinitionTable)"
  - word: kanbo
    note: The rule is obligatory, so kan+bo never surfaces unchanged.
    expect_fail: true
  - word: kanmo
    note: Only KAN+MO; a KAN+BO reading would have lost the n.
    parses:
      - signature: "KAN+MO|kan+?mo"
        rules: [mrSfxMo, prPostNasal]
  - word: katbo
    note: No nasal before the boundary, so the rule does not apply.
    parses:
      - signature: "KAT+BO|kat+?bo"
        rules: [mrSfxBo]
  - word: katmo
    note: Underlying suffix m after a non-nasal.
    parses:
      - signature: "KAT+MO|kat+?mo"
        rules: [mrSfxMo]
  - word: kan
    note: Bare root.
    parses:
      - signature: "KAN|kan"
        rules: []
  - word: kat
    note: Bare root.
    parses:
      - signature: "KAT|kat"
        rules: []
  - word: ka
    note: Bare root.
    parses:
      - signature: "KA|ka"
        rules: []
