#
# Authoring note (G2a discipline, `conformance-staging/edge-cases/mpr-gated-exception`'s own fix for
# the identical symptom, re-confirmed while authoring `right-to-left-bounded-quantifier-rewrite`):
# every segment carries a fully-unique feature bundle so no phonological-subrule rewrite collapses
