# transcribed verbatim from that run, not hand-derived.
#
# RE-VERIFIED against the C# founding oracle (this task's own oracle-discipline follow-up): run in
# isolation (a scratch copy of this fixture alone, `hc-conformance.exe --fixtures <scratch>
# --propose`, self-check mode -- in-process XmlLanguageLoader + Morpher, the same binary named in
# this repo's own oracle-discipline rule) and also as part of the full corpus's ordinary self-check
# sweep, both PASS with no --propose patch. NO DIVERGENCE FOUND: every signature below --
# des/sed's ordinary parses, basi/abis's SKIPPED (InvalidShapeException) status, and eds's
