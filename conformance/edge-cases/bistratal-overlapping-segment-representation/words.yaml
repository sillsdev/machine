# Synthetic construct-shaped mimic -- see STAGING.md and grammar.xml's own header comment. Oracle:
# pangloss (`pg_parse::Morpher`, driven directly -- see STAGING.md's "Verification" section), NOT the
# C# founding oracle -- authored and verified against this repo's own Rust engine only. Signatures
# below are transcribed verbatim from that run, not hand-derived.

language: BistratalOverlappingSegmentRepresentation
inspired_by: ["synthetic bistratal shared-representation probe (not modeling any real language)"]
sources:
  - "docs/conformance/representative-typology-basis.md S1.2.5 (Multi-table: shared-representation-across-tables configuration)"
requires: []
words:
  - word: des
    note: >-
      ROOT3, entered on the Outer stratum (table t2), whose own "s" segment ("cs2") is the fixture's
      divergent-identity witness -- SAME spelling as t1's own "s" ("cs1"), DIFFERENT
      SegmentDefinition/identity. A plain positive control proving the Outer stratum's own lexicon
      works normally despite the shared representation.
    provenance: "docs/conformance/representative-typology-basis.md S1.2.5"
    parses:
      - signature: "ROOT3|des"
        rules: []
        exercises:
          - "CharacterDefinitionTable: more than one table, one per stratum"

  - word: sed
    note: ROOT4, also Outer-stratum, also using t2's own "s" -- a second positive control (different root, same table).
    provenance: "docs/conformance/representative-typology-basis.md S1.2.5"
    parses:
      - signature: "ROOT4|sed"
        rules: []
        exercises:
          - "CharacterDefinitionTable: more than one table, one per stratum"

  - word: basi
    note: >-
      ROOT1, entered on the Inner stratum (table t1) -- its own "s" is "cs1", a DIFFERENT segment
      from t2's "cs2" despite the identical spelling ("s" shared across BOTH tables is exactly
      what makes `Grammar::char_tables` non-pairwise-disjoint, per multi_table_detail's own check).
      Per pg_parse::Morpher's own surface-tokenization convention (mirroring `pg_foma::emit::
      surface_table`'s "last stratum's table" rule), the initial input string is segmented ONLY
      against the grammar's LAST stratum's table (t2 here) -- t2 never declares "a"/"b"/"i" at all,
      so a bare Inner-stratum root can never itself be a complete, tokenizable surface word in this
      architecture (matching `tests/two_table_symbol_divergence.rs`'s own documented "a bare,
      unaffixed root declared on a NON-final stratum... is never a complete surface word by itself"
      finding for the analogous disjoint-table case) -- an architectural fact about multi-stratum
      derivation generally, NOT a MultiTable-shared-representation-specific bug. Pinned honestly as
      SKIPPED (invalid shape), not silently omitted.
    provenance: "rust/crates/pg-foma/tests/two_table_symbol_divergence.rs module doc"
    expect_skip: true
    exercises:
      - "CharacterDefinitionTable: more than one table, one per stratum"

  - word: abis
    note: ROOT2, also Inner-stratum -- same architectural non-reachability as basi.
    provenance: "rust/crates/pg-foma/tests/two_table_symbol_divergence.rs module doc"
    expect_skip: true
    exercises:
      - "CharacterDefinitionTable: more than one table, one per stratum"

  - word: eds
    note: >-
      A well-formed string over t2's OWN alphabet (e, d, s all legitimate t2 segments) that is
      simply not any lexical entry's own shape -- a plain negative control proving t2's inventory
      coverage alone doesn't manufacture spurious analyses.
    expect_fail: true
    exercises:
      - "CharacterDefinitionTable: more than one table, one per stratum"
