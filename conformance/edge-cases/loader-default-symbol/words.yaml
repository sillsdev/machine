# Converted from conformance/loader/n2-default-symbol (v1, removed after the v1->v2 migration's
# parity proof). grammar.xml is the same file, unmodified.
#
# What this pins (from the v1 fixture's README.md/manifest.json): C# XmlLanguageLoader.LoadFeature
# reads SymbolicFeature@defaultSymbol into SymbolicFeature.DefaultSymbolID, consumed only when
# useDefaults=true (the four phonological-rule matchers set this) -- for a pattern-pinned feature a
# data node leaves UNSET, substitute the feature's default value and check THAT, instead of treating
# "unset" as vacuously compatible with anything. Feature "nas" here declares
# defaultSymbol="symNasPlus" (+); segment "a" carries no explicit "nas" value; rule "pr1" rewrites
# ncOral (nas=-) targets to ncLong (len=+).
#
# "bat" is the UseDefaults signal: "a"'s effective nas is the default (+), which fails ncOral's
# nas=- pin, so pr1 must NOT fire during the confirming synthesis and the surface stays "bat". A
# defaults-unaware matcher (the pre-fix Rust bug: unconstrained lane overlaps any pin) would instead
# fire the rule, mutate "a" (len=long, char-def identity cleared -> renders as "aa", the only
# len=Long segment), produce surface "baat" != "bat", and report "-" (no parse) where the correct
# behavior is "|bat".
#
# "bdt" is the control (expected zero parses in BOTH engines): "d" is explicitly nas=- (an explicit
# value, not a default fallback), so pr1 legitimately fires on it during the confirming synthesis in
# both engines, and the resynthesized surface is no longer "bdt" -- pins that UseDefaults handling
# does not over-suppress a rule whose pin is satisfied by an explicit value, proving the "bat"
# divergence above is really about defaultSymbol, not some other loader/matcher bug.

language: N2-DefaultSymbol
inspired_by: ["synthetic loader-semantics probe (not modeling any real language)"]
sources:
  - "rust/parity-out/audit/phase2/C-loader-parity.md (Phase-2 audit C finding N2)"
requires: [phonology]
fieldworks_producible: false
fieldworks_producible_notes: >-
  KEEP-ENGINE-ONLY until the FieldWorks side gains a writer -- a loader gap, NOT a data-model limit. LibLCM CAN express a feature default: FsFeatDefn (base of the FsClosedFeature that stands in for SymbolicFeature) owns a Default property of type FsFeatureSpecification, whose own model comment reads "Feature of number might have a default value of singular" (MasterLCModel.xml:1342-1345). HCLoader simply never reads it. Deleting this fixture would leave SymbolicFeature.defaultSymbol unwitnessed anywhere in the suite, and would also discard the regression that a future writer would need.
  Exercises SymbolicFeature.defaultSymbol; LoadFeatureSystem (HCLoader.cs:2650-2667) never sets a
  default value on any SymbolicFeature it builds -- the engine's DefaultSymbolID/DefaultValue has no
  HCLoader writer.
words:
  - word: bat
    note: >-
      The UseDefaults signal: middle segment "a" carries no explicit "nas" value, so its effective
      nas (the feature's declared default, +) fails ncOral's nas=- pin -- pr1 (Lengthen oral
      segment) must NOT fire, and the surface stays "bat" unmutated.
    provenance: "Phase-2 audit C finding N2 (SymbolicFeature@defaultSymbol / UseDefaults)"
    parses:
      - signature: "|bat"
        gloss: bat
        rules: []
        exercises:
          - "Boundary markers (CharacterDefinitionTable)"

  - word: bdt
    note: >-
      Control (expected zero parses in both engines): middle segment "d" is EXPLICITLY nas=- (not a
      default fallback), so pr1 legitimately fires during the confirming synthesis, mutating "d" so
      the resynthesized surface is no longer "bdt" -- proves the bat/UseDefaults divergence is
      really about defaultSymbol, not some other loader/matcher bug.
    provenance: "Phase-2 audit C finding N2 (SymbolicFeature@defaultSymbol / UseDefaults)"
    expect_fail: true
    blocked_by: [pr1]
    exercises:
      - "Boundary markers (CharacterDefinitionTable)"
