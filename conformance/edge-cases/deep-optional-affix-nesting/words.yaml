  - word: "xxxxxxxxxxxxk"
    note: >-
      The all-slots-fired boundary case, the mirror image of "k": with all 12 x's present, every
      single slot must have fired (no other subset of size 12 exists out of 12), so C(12,12) = 1 --
      back down to exactly one analysis, confirming the combinatorics collapse correctly at the
      other extreme. Morph order is P12..P1..K because each later-firing slot's InsertSegments
      prepends its "x" further to the left than every slot that fired before it (confirmed against
      v1's own expected.tsv).
    provenance: "F3 worked example (pathological category): 12 independent all-optional affix-template prefix slots inserting an identical literal character, producing C(12,k) equally-valid analyses for a k-x-prefixed word (924 for k=6, confirmed against the live oracle: 3 words, ~2.0s total wall-clock on this branch's un-optimized plain-master engine)"
    parses:
      - signature: "P12+P11+P10+P9+P8+P7+P6+P5+P4+P3+P2+P1+K|xxxxxxxxxxxxk"
        rules: [mrP12, mrP11, mrP10, mrP9, mrP8, mrP7, mrP6, mrP5, mrP4, mrP3, mrP2, mrP1]
        exercises:
          - "Affix template slots (obligatory/disjunctive/ordering)"
