        exercises: ["MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"]
  - word: tagaka
    note: >-
      Half-only control: ga carries FieldWorks prohibitions that name only the prefix half ta (in both directions); HCLoader resolves them to no rule, so every pairing parses on ga (this one is ta-...-ka).
    parses:
