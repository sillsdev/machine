# Replayed on hc.dll at Machine aab4c598 (see README.md): the rows below are the oracle's own output.
# Synthetic; no real language.
# The grammar is the per-pairing form HCLoader emits for a circumfix entry (prefix halves ta/to x suffix halves
# ka/ki = four subrules, HCLoader.cs:1097-1122). All four pairings are registered under the circumfix lexeme
# form in m_allomorphs, so a prohibition naming that lexeme form is attached to every pairing, on both sides
# (HCLoader.cs:2212-2236). A loader that kept one allomorph per allomorph identity would still parse tadaka/
# tabaka etc. through the pairings the rule did not reach. A prohibition naming only one half is not a key of
# m_allomorphs, so HCLoader emits no rule for it: the FieldWorks witness carries such prohibitions on ga (both
# directions) and the words on ga below still parse.
language: AdhocProhibitionCircumfixPairings
inspired_by: ["a circumfix entry with two prefix halves and two suffix halves compiles to four pairing subrules; an ad hoc allomorph prohibition naming the circumfix lexeme form is attached to every pairing; one naming a single half resolves to nothing"]
sources: ["HCLoader.cs:1097-1122 (LoadAffixProcessAllomorphs, circumfix branch)", "HCLoader.cs:2212-2236 (LoadAllomorphCoOccurrenceRules)"]
requires: []
fieldworks_producible: true
words:
  - word: da
    note: >-
      Control: bare stem da parses.
    parses:
      - signature: "DA|da"
        rules: []
        exercises: ["MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule"]
  - word: ba
    note: >-
