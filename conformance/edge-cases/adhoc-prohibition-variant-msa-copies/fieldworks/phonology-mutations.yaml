version: 1
base_sha256: d20c19104f808651aabde67cc06ecbc238b8b69468fa87b80551a7684f6883b0
cases:
  - id: empty-phoneme-inventory
    operations:
      - remove_all_phonemes:
          require_unreferenced: true
    expect:
      xample_projection: same_as_base
      hc_analyses: same_as_base
      inferred_segments: [t, a, d, b, g, i]
  - id: remove-g-only
    operations:
      - remove_phoneme:
          guid: 7727ef40-6fec-407c-8adb-ee30436d8697
          assert_representations: [g]
          require_unreferenced: true
    expect:
      xample_projection: same_as_base
      hc_analyses: same_as_base
      inferred_segments: [g]
