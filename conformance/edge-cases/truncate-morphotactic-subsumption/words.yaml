# oracle-provenance: founding-oracle
language: TruncateSubsumptionProbe
inspired_by: ["synthetic affix truncation and inserted-host attribution probe"]
sources:
  - "Machine #480 truncate-morphotactic at fa8d9b2540962981add315d06203e928a11c1853; companion adds root ag, prefix X, and explicit MorphemeId values"
  - "Combined C# oracle: Machine #556 d98d12a5d514ce589d7495c71d055830e061a418 plus Machine #500 ApplyRhs relocation at 157c031ef272d07c900db41b2d4a8852b13f64b0"
requires: []
fieldworks_producible: true
words:
  - word: ag
    note: "Root control and X then B, where B removes X without inserting material."
    parses:
      - signature: "ROOTAG|ag"
        rules: []
      - signature: "ROOTAG+X+B|ag"
        rules: [mrulePrefixX, mruleTruncLead]
        exercises: ["AffixProcessRule: subtraction/truncation"]

  - word: sag
    note: "X prefixes s and preserves the root."
    parses:
      - signature: "X+ROOTAG|sag"
        rules: [mrulePrefixX]

  - word: gag
    note: "Four forward chains; X+B+C and C+X+B retain duplicate signature X+C+ROOTAG+B with distinct application histories."
    parses:
      - signature: "X+C+ROOTAG|gag"
        rules: [mrulePrefixX, mruleTruncOptIns]
        exercises: ["AffixProcessRule: subtraction/truncation"]
      - signature: "X+C+ROOTAG+B|gag"
        rules: [mrulePrefixX, mruleTruncLead, mruleTruncOptIns]
        exercises: ["AffixProcessRule: subtraction/truncation"]
      - signature: "X+C+ROOTAG+B|gag"
        rules: [mruleTruncOptIns, mrulePrefixX, mruleTruncLead]
      - signature: "C+ROOTAG|gag"
        rules: [mruleTruncOptIns]

  - word: bag
    note: No lexical entry or rule chain can produce bag.
    expect_fail: true
