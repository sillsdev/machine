words:
  - word: kotab
    note: KTB bare root, no infix -- a plain control.
    parses:
      - signature: "KTB|kotab"
        rules: []

  - word: kpfotab
    note: >-
      KTB + mrPfv: the perfective infix "pf" inserted after the root's first consonant ("k"),
      InsertSegments around a root Copy -- exactly austronesian-phase's mrInfixUm shape, mimicking
      templatic interdigitation.
    provenance: "docs/conformance-staging-plan.md pathology catalog (templatic-Semitic row): infix interdigitation"
    parses:
      - signature: "KTB+PFV|kpfotab"
        rules: [mrPfv]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: kcvotab
    note: KTB + mrConv, the independent converb infix "cv" -- the same interdigitation mechanism, a different marker.
    provenance: "docs/conformance-staging-plan.md pathology catalog (templatic-Semitic row): infix interdigitation"
    parses:
      - signature: "KTB+CONV|kcvotab"
        rules: [mrConv]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: ጸa
    note: >-
      TSU root, spelled with its ORIGINAL representation (ጸ). Bare-root control for the
      merged-letter-series pair below. The rendered signature shows the bracketed alternates class
      "[ጸፀ]" rather than a literal "ጸ" -- `cSTz`'s two representations are feature-identical (no
      other segment in this grammar shares its feature bundle), so the engine's shape-rendering
      correctly reports "this position matches either spelling of the merged segment", which is
      exactly the point being pinned.
    provenance: "docs/conformance-staging-plan.md pathology catalog (templatic-Semitic row): merged letter-series"
    parses:
      - signature: "TSU|[ጸፀ]a"
        rules: []

  - word: ፀa
    note: >-
