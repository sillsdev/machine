# oracle-provenance: forward-synthesis
#
# REGRESSION PIN FOR AN ANALYSIS PARSE LOSS FIXED BY sillsdev/machine#494. Every word here records
# the founding oracle's own output except `zudiua`, whose expected parse was derived from the grammar
# rather than from any engine: apply the rules in order, check each rule's RequiredHeadFeatures against
# the previous rule's OutputHeadFeatures, and see that the chain builds the surface. An engine that
# cannot invert a derivation it can perform is wrong regardless of which engine it is.
# Signatures other than `zudiua`'s were transcribed from `hc-conformance --propose` output on branch
# conformance/exact-analysis-fs-divergence at d3b7643d.
#
# History: the fixture was written red, before the fix. Under master's earlier Add semantics the
# oracle returned no analysis of `zudiua`; it has parsed since #494 (7109531e, "Change Add to
# PriorityUnion") merged, checked by running this fixture against master at 52d069f8 (red) and
# 7109531e (green). Earlier notes said the loss survived PriorityUnion; that was measured on the
# pre-merge research branch perf/pr494-priority-union, not on what merged.
#
# Mechanism of the original loss: analysis (un-application) walks a derivation outside-in. mrOuter's
# own OutputHeadFeatures (tense=past) was folded onto the stem as it was un-applied and never retracted
# before mrInner was tried next; mrInner's own OutputHeadFeatures (tense=pres) was then checked for
# unifiability against a stem still carrying tense=past, and the check refused the whole derivation.
# Tracked by sillsdev/machine#504.
#
# Word list:
#   zud      bare root control -- the grammar loads and the root parses unaffixed.
#   zudi     mrInner alone -- writes tense=pres, no gate to fail. Control that mrInner works in
#            isolation.
#   zudu     mrOuter alone -- writes tense=past, no gate to fail. Control that mrOuter works in
#            isolation.
#   zudua    root+mrOuter+mrOutermost (mrInner SKIPPED). mrOuter's tense=past write is exactly what
#            mrOutermost's RequiredHeadFeatures checks, and nothing else intervenes to clobber it.
#            THE fixture's own non-vacuousness control: a three-morph chain through the very same
#            override-then-gate pair parses cleanly whenever mrInner (the rule whose own re-unification
#            is what actually fails) is not part of the chain.
#   zudia    root+mrInner+mrOutermost (mrOuter SKIPPED). mrOutermost requires tense=past, but only
#            mrInner ran (tense=pres) -- negative control that mrOutermost's gate is a real feature
#            check, not vacuously satisfied by any suffix chain of the right length.
#   zudiua   root+mrInner+mrOuter+mrOutermost, the FULL chain, and the regression pin: root, then
#            mrInner's tense=pres write, then mrOuter's tense=past override, then mrOutermost's
#            tense=past gate. Before #494 the oracle returned no analysis, because mrInner's
#            re-unification against the leftover tense=past failed first.

language: ChainedOutputFeatureOverrideLoss
inspired_by: ["synthetic chained-suffix tense-override probe (not modeling any real language)"]
sources:
  - "src/SIL.Machine.Morphology.HermitCrab/MorphologicalRules/AnalysisAffixProcessRule.cs"
  - "perf/pr494-priority-union:src/SIL.Machine.Morphology.HermitCrab/MorphologicalRules/AnalysisSyntacticFeatureMerge.cs"
  - "perf/pr494-priority-union:docs/pr494-review.md (section 4, OverrideLoss_TenseFlipFlop)"
  - "PanGloss rust/crates/pg-parse/tests/exact_analysis_fs_recall.rs (fix/exact-analysis-fs branch)"
requires: []
fieldworks_producible: false
fieldworks_producible_notes: >-
  MorphologicalRuleOrder: HCLoader hardcodes Unordered at every Stratum it builds (HCLoader.cs:227,
  230,374) and can never emit `linear`. This fixture declares its Stratum `morphologicalRuleOrder=
  "linear"` (grammar.xml) so the three-suffix chain is unambiguous by construction; not re-verified
  against an `unordered` re-run since the point under test (analysis-side feature bookkeeping, not
  morphotactic ordering) does not depend on that declaration either way. Follows the same precedent
  and citation as edge-cases/feature-gating-breadth.
words:
  - word: zud
    note: Bare root, unaffixed, untensed. Control that the grammar loads and the root parses on its own.
    parses:
      - signature: "ZUD|zud"
        rules: []
        exercises:
          - "Syntactic feature agreement (RequiredHeadFeatures/OutputHeadFeatures/RequiredFootFeatures/OutputFootFeatures)"

  - word: zudi
    note: mrInner alone. No RequiredHeadFeatures to fail; writes tense=pres via OutputHeadFeatures.
    parses:
      - signature: "ZUD+INNER|zudi"
        rules: [mrInner]
        exercises:
          - "Syntactic feature agreement (RequiredHeadFeatures/OutputHeadFeatures/RequiredFootFeatures/OutputFootFeatures)"

  - word: zudu
    note: mrOuter alone. No RequiredHeadFeatures to fail; writes tense=past via OutputHeadFeatures.
    parses:
      - signature: "ZUD+OUTER|zudu"
        rules: [mrOuter]
        exercises:
          - "Syntactic feature agreement (RequiredHeadFeatures/OutputHeadFeatures/RequiredFootFeatures/OutputFootFeatures)"

  - word: zudua
    note: >-
      root+mrOuter+mrOutermost, mrInner skipped. Non-vacuousness control: the very same
      override-then-gate pair (mrOuter writes tense=past, mrOutermost requires it) succeeds cleanly
      whenever mrInner is not part of the chain -- the loss on zudiua below is specific to mrInner's
      own re-unification, not a general failure of this gate.
    parses:
      - signature: "ZUD+OUTER+OUTERMOST|zudua"
        rules: [mrOuter, mrOutermost]
        exercises:
          - "Syntactic feature agreement (RequiredHeadFeatures/OutputHeadFeatures/RequiredFootFeatures/OutputFootFeatures)"

  - word: zudia
    note: >-
      root+mrInner+mrOutermost, mrOuter skipped. Negative control: mrOutermost requires tense=past,
      but only mrInner ran (tense=pres survives unclobbered), so the gate genuinely refuses -- it is
      not vacuously satisfied by any three-morph chain of the right shape.
    expect_fail: true
    blocked_by: [mrOutermost]
    exercises:
      - "Syntactic feature agreement (RequiredHeadFeatures/OutputHeadFeatures/RequiredFootFeatures/OutputFootFeatures)"

  - word: zudiua
    note: >-
      The regression pin, and the one word whose expected parse is derived from the grammar rather
      than recorded from the oracle. root+mrInner+mrOuter+mrOutermost is a well-formed four-morph
      chain: zud (no tense) -> mrInner writes tense=pres -> mrOuter writes tense=past ->
      mrOutermost's RequiredHeadFeatures tense=past is satisfied. Compare zudua above, the same gate
      pair one rule shorter. Before #494 the oracle found no analysis here: mrOuter's tense=past was
      folded onto the stem during analysis and never retracted, so mrInner's own OutputHeadFeatures
      (tense=pres) failed unification. It parses on master since #494.
    parses:
      - signature: "ZUD+INNER+OUTER+OUTERMOST|zudiua"
        rules: [mrInner, mrOuter, mrOutermost]
        exercises:
          - "Syntactic feature agreement (RequiredHeadFeatures/OutputHeadFeatures/RequiredFootFeatures/OutputFootFeatures)"
