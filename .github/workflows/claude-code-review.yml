name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Parallel reviews of one PR cannot see each other's comments and post duplicates.
# A cancelled run may leave a partial round; the next one picks up its threads.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A rebase or a merge from master that keeps the PR's changes needs no new round. It
  # compares with the last summary's commit: a quick rebase can cancel the round before it.
  changes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      review: ${{ steps.compare.outputs.review }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare with the last reviewed commit
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          reviewed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments"             --jq '.[] | select(.user.login == "claude[bot]") | .body'             | grep -oE 'Reviewed at [0-9a-f]{40}' | tail -n 1 | cut -d' ' -f3)
          pr_patch_id() {
            git diff "$(git merge-base "origin/$BASE" "$1")" "$1" | git patch-id --stable
          }
          if [ -n "$reviewed" ] && git fetch --quiet origin "$reviewed"             && [ "$(pr_patch_id "$reviewed")" = "$(pr_patch_id "$HEAD_SHA")" ]; then
            echo "The changes at $HEAD_SHA match those reviewed at $reviewed; skipping the review."
            echo "review=false" >> "$GITHUB_OUTPUT"
          else
            echo "review=true" >> "$GITHUB_OUTPUT"
          fi

  claude-review:
    needs: changes
    # Fork PRs get no secrets, so only same-repo branches are reviewed. That also keeps the
    # restore from running a non-member's MSBuild targets, and keeps the PR's AGENTS.md trusted.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.review == 'true'

    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Lets the reviewer cite CI results from gh pr checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so the reviewer can read git log and blame, and diff against
          # the base branch locally rather than only seeing the PR's final state.
          fetch-depth: 0

      - uses: lukka/get-cmake@v4.2.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Install libgoogle-perftools-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y libgoogle-perftools-dev

      # Lets the reviewer build and run tests to falsify its own findings. It is not here
      # to gate the PR -- the CI build already does that.
      - name: sentencepiece4c build
        run: |
          cmake -S ${{ github.workspace }}/src/sentencepiece4c -B ${{ github.workspace }}/src/sentencepiece4c/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{ github.workspace }}/src/sentencepiece4c/build --config Release --target sentencepiece4c

      - name: Restore dependencies
        run: |
          dotnet tool restore
          dotnet restore

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A push by the @claude workflow makes claude[bot] the actor, which the action
          # rejects unless allowed. The review never pushes, so it cannot retrigger itself.
          allowed_bots: claude
          additional_permissions: |
            actions: read
          # pr-review has the built-in code-review skill find and verify at "high"
          # effort, then decides what gets posted.
          prompt: '/pr-review ${{ github.event.pull_request.number }}'
          # v1 has no `model` input; the alias follows the newest Opus the action's CLI
          # knows, so review behavior and cost can change with no commit here.
          claude_args: >-
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(dotnet build:*),Bash(dotnet test:*)"
            --append-system-prompt "Allowed commands match by prefix, so run dotnet build and dotnet test from the repository root as they are, not after cd or inside a wrapper such as timeout."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action hides Claude's output, so the log does not say which calls were denied.
      # Only the command or target is printed, never file content, and @json keeps it on one
      # line so a denied command cannot issue a "::" workflow command.
      - name: Show denied tool calls
        if: always() && steps.claude-review.outputs.execution_file != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: >-
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
          | "\(.tool_name): \((.tool_input.command? // .tool_input.file_path? // .tool_input.url?
          // .tool_input.pattern? // "") | @json | .[:300])"'
          "$EXECUTION_FILE"
