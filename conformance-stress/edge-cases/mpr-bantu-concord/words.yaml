# kind: stress (timing and optimization parity fixture, not conformance; see conformance-stress/README.md)
# Stress fixture for trail MPR replay, Bantu style: six noun-class features in one MPR group gate three
# agreement slots (subject concord, object concord, final vowel), each with one allomorph per class and
# homophonous shapes across classes. The object concord has one allomorph gated by excludedMPRFeatures.
# Expected parses were derived by hand from the concord tables in grammar.xml and confirmed against the engine.
language: StressMprBantuConcord
inspired_by: ["Bantu noun-class agreement (Swahili, Shona style); synthetic, not modeling a real language"]
sources:
  - "research stress fixture; no external source"
requires: []
fieldworks_producible: false
fieldworks_producible_notes: "research stress fixture; not authored through FieldWorks"
budget_ms: 15000
words:
