# kind: stress (timing and optimization parity fixture, not conformance; see conformance-stress/README.md)
# HAND DERIVATION (see grammar.xml). Pure-morphotactics Bantu-like stress grammar, no phonology.
# Verb template, application order innermost to outermost: extension (optional suffix, 2 fillers),
# final vowel (optional suffix, 2), object marker (optional prefix, 6), TAM (REQUIRED prefix, 5),
# subject marker (optional prefix, 8). Surface = SM TAM OM root EXT FV. Noun template: one REQUIRED
# class prefix (6 fillers). 16 verb roots and 14 noun roots; several noun and verb shapes coincide
# (lim tum kal bon lek) and noun roots like kilim/tuma contain verb-affix material, so bare stems
# and partly unapplied forms reach root lookup and die at the required slot.
# For each word the parses below are every (root, slot choice) whose surface equals the word. They
# were enumerated by a small independent script over the slot tables above, then confirmed against
# the engine with PruneByTemplateReplay off. A word with no derivation is an expect_fail word; its
# blocked_by names the required-slot rule class that no analysis can supply.
# Signature: morpheme IDs outermost first, then the root, then "|" and the surface.
language: StressRequiredTemplateSlot
inspired_by: ["Bantu verb templates with a required TAM slot (synthetic stress, not a specific language)"]
sources:
  - "synthetic stress fixture for E3 (template replay at lexical lookup)"
requires: []
fieldworks_producible: true
budget_ms: 60000
