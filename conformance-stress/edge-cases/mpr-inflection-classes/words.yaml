# kind: stress (timing and optimization parity fixture, not conformance; see conformance-stress/README.md)
# Stress fixture for trail MPR replay: five declension classes carried as one MPR group, 20 noun roots
# (four per class, stems overlapping in shape across classes), and case/number suffixes with one allomorph
# per class, each gated by requiredMPRFeatures. Endings are homophonous across classes and cases, so most
# analyses of a surface form pick a suffix allomorph of the wrong class and die in synthesis on the MPR check.
# The DAT rule has one allomorph gated by excludedMPRFeatures. The DER slot outputs features of an Overwrite
# group (Theme), which also feeds the NOM "ak" allomorph. Expected parses were derived by hand from the
# ending tables in grammar.xml (root + optional DER + optional PL + one case ending, class-gated) and
# confirmed against the engine.
language: StressMprInflectionClasses
inspired_by: ["Indo-European declension classes (Latin, Russian style); synthetic, not modeling a real language"]
sources:
  - "research harness stress fixture; no external source"
requires: []
fieldworks_producible: false
fieldworks_producible_notes: "research stress fixture; not authored through FieldWorks"
budget_ms: 15000
