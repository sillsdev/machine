# kind: stress (timing and optimization parity fixture, not conformance; see conformance-stress/README.md)
# HAND DERIVATION. Every suffix is a rule with several allomorphs, each with a RequiredEnvironments on the
# stem's left context (grammar.xml). The environments of one rule are mutually exclusive, so exactly one
# allomorph is valid for a given stem and no disjunctive re-check rejects. Rules: nouns take PL, POSS, CASE
# in that slot order (all optional); verbs take PAST then EVID.
#   PL    last vowel a -> lar, o/u -> lor, e/i -> ler, y -> lyr.
#   POSS  last vowel selects ana, ono, unu, ene, ini, yny (a, o, u, e, i, y).
#   CASE  vowel class of the last vowel x stem-final vowel (V) or consonant (C): a ka/nka, o/u ko/nko, e/i ke/nke, y ky/nky.
#   PAST  vowel class x stem-final voicing (voiced l r n d m -> d; voiceless k t s -> t): da ta, do to, de te, dy ty.
#   EVID  vowel class: mas, mos, mes, mys.
# "Last vowel" means the last vowel of the stem built so far, including earlier suffixes.
# Allomorph lists are ordered differently per rule, so recorded indices spread over 0..A-1; this is the point
# of the fixture (E1, the synthesis allomorph loop cutoff). Expected parses below were derived by applying
# these rules and enumerating every root and slot choice that produces each surface form, so ambiguous
# surfaces list every analysis. They were then confirmed against the engine with the cutoff off.
language: StressAllomorphListDensity
inspired_by: ["synthetic Turkic/Uralic vowel harmony written as separate environment-conditioned allomorphs"]
sources:
  - "E1 stress fixture, hermitcrab-2026-10-27-synthesis-to-analysis-round"
requires: []
fieldworks_producible: true
budget_ms: 60000
