# kind: stress (timing and optimization parity fixture, not conformance; see conformance-stress/README.md)
# HAND DERIVATION. Prefix rules, each with allomorphs conditioned on the first segment of the stem to its right
# (RightEnvironment). Environments of one rule are mutually exclusive, so exactly one allomorph is valid.
#   CLS  (noun class): p t k -> mu, b d g -> ng, m n -> ny, a -> ka, e i -> ki, o u -> ku, l -> lu
#   PLU  (plural, outside CLS): e i -> ba, p t k -> ma, b d g -> ve, a o u -> va, m n l -> be
#   OBJ  (verb, inner): b d g m n l -> ku, p t k -> ji, vowel -> mi
#   SUBJ (verb, outer): p t k -> ni, any vowel -> tu, b d g -> ko, m n -> si, l -> wa
# Prefixes are applied innermost first, so an outer prefix sees the first segment of the inner prefix.
# Allomorph lists are ordered differently per rule, so recorded indices spread over 0..A-1. Every expected
# parse enumerates every root and slot choice that yields the surface, so ambiguous surfaces list all analyses.
# Confirmed against the engine with the E1 cutoff off.
language: StressBantuPrefixDensity
inspired_by: ["synthetic Bantu noun-class and agreement prefixes written as separate environment-conditioned allomorphs"]
sources:
  - "E1 stress fixture 2, hermitcrab-2026-10-27-synthesis-to-analysis-round"
requires: []
fieldworks_producible: true
budget_ms: 60000
